[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qal"
version = "0.1.0"
description = "Tigrinya language model training project"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "torch>=2.0",
    "tokenizers",
    "datasets",
    "pandas",
    "numpy",
    "matplotlib",
    "tqdm",
    "pyyaml",
    "wandb",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
    "wordcloud",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "model*", "training*", "config*", "tokenization*", "inference*", "finetuning*"]

