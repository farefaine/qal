# Tiny model - cheapest tier, proves the pipeline works

model:
  vocab_size: 8192
  context_length: 128
  emb_dim: 256
  n_heads: 4        # 64 dims per head
  n_layers: 2
  drop_rate: 0.1      # blog range is 0.1-0.2; per-tier value comes from training runs
  qkv_bias: false

metadata:
  name: "tigrinya-gpt-tiny"
