# Base model - past Chinchilla on purpose; extra budget goes into width

model:
  vocab_size: 8192
  context_length: 128
  emb_dim: 512
  n_heads: 8        # 64 dims per head
  n_layers: 4
  drop_rate: 0.1      # blog range is 0.1-0.2; per-tier value comes from training runs
  qkv_bias: false

metadata:
  name: "tigrinya-gpt-base"
